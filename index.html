<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIT Handouts - Complete System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen">
<script>
const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbz2DGJZ1J66ZoDw1MKXAarwbyp17dYUvLGxcIHmMzmJX7MzdoVKqS3NaEqhEjUnY7TP/exec";
const REP_PASSWORD = "DIT2027";
const REP_WHATSAPP = "233000000000";
</script>
<header class="bg-white/80 backdrop-blur shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i class="fas fa-graduation-cap"></i></div><div><h1 class="font-bold">DIT HANDOUTS</h1><p class="text-[11px] text-slate-500">Live Sync • All Reps</p></div></div>
    <div class="flex gap-2"><button onclick="switchTab('student')" id="tab-student" class="px-5 py-2 rounded-full bg-indigo-600 text-white text-sm">Student</button><button onclick="switchTab('rep')" id="tab-rep" class="px-5 py-2 rounded-full bg-white border text-sm">Rep</button><button id="logoutBtn" onclick="repLogout()" class="hidden px-3 py-2 rounded-full bg-red-50 text-red-600 text-sm"><i class="fas fa-sign-out"></i></button></div>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 py-6">
<div id="loginModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm"><h3 class="font-bold">Rep Login</h3><input id="repPassInput" type="password" placeholder="Password" class="w-full mt-4 px-4 py-3 rounded-xl border"><p id="loginError" class="text-sm text-red-500 mt-2 hidden">Wrong password</p><div class="flex gap-2 mt-4"><button onclick="closeLogin()" class="flex-1 py-2.5 rounded-xl border">Cancel</button><button onclick="repLogin()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white">Login</button></div></div></div>

<div id="portal-student">
  <div class="grid md:grid-cols-2 gap-6 max-w-5xl mx-auto">
    <div class="bg-white rounded-[24px] p-6 md:p-8 shadow-sm"><h2 class="text-2xl font-bold">Request Handout</h2><p class="text-sm text-green-600">Rep will approve after MoMo confirmation</p>
      <form id="studentForm" class="space-y-4 mt-5">
        <div><label class="text-sm font-medium">Full Name *</label><input id="s_name" required class="w-full mt-1 px-4 py-3 rounded-xl border"></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-medium">Student ID (optional)</label><input id="s_id" class="w-full mt-1 px-4 py-3 rounded-xl border" placeholder="or leave blank if using name"></div><div><label class="text-sm font-medium">Course</label><select id="s_course" class="w-full mt-1 px-4 py-3 rounded-xl border"><option>DIT Level 100</option><option>DIT Level 200</option><option>DIT Level 300</option><option>DIT Level 400</option></select></div></div>
        <div><label class="text-sm font-medium">WhatsApp Number *</label><input id="s_phone" required class="w-full mt-1 px-4 py-3 rounded-xl border"></div>
        <div><label class="text-sm font-medium">Handout Name *</label><select id="s_handout" class="w-full mt-1 px-4 py-3 rounded-xl border"><option>Data Structures</option><option>Networking Notes</option><option>Programming C++</option><option>Database Systems</option><option>Other</option></select></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-medium">Amount Paid (GHS) *</label><input id="s_amount" type="number" required class="w-full mt-1 px-4 py-3 rounded-xl border"></div><div><label class="text-sm font-medium">Quantity</label><input id="s_qty" type="number" value="1" class="w-full mt-1 px-4 py-3 rounded-xl border"></div></div>
        <div><label class="text-sm font-medium">MoMo Name *</label><input id="s_momo" required class="w-full mt-1 px-4 py-3 rounded-xl border" placeholder="Name used for MoMo"></div>
        <button id="s_btn" type="submit" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-semibold">Submit Payment Proof</button><p id="s_msg" class="text-center text-sm"></p>
      </form>
    </div>
    <div class="space-y-4"><div class="bg-white rounded-[24px] p-6"><h3 class="font-bold">Check your status</h3><div class="flex gap-2 mt-3"><input id="studentSearch" placeholder="Name or ID" class="flex-1 px-4 py-2.5 rounded-xl border text-sm"><button onclick="searchMyRecord()" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm">Check</button></div><div id="myRecordResult" class="mt-3 text-sm bg-slate-50 rounded-xl p-3 hidden"></div></div></div>
  </div>
</div>

<div id="portal-rep" class="hidden">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5"><div class="bg-white rounded-2xl p-4"><p class="text-xs">Total</p><p id="statTotal" class="text-2xl font-bold">0</p></div><div class="bg-amber-50 rounded-2xl p-4"><p class="text-xs">Pending</p><p id="statPending" class="text-2xl font-bold">0</p></div><div class="bg-green-50 rounded-2xl p-4"><p class="text-xs">Approved</p><p id="statApproved" class="text-2xl font-bold">0</p></div><div class="bg-blue-50 rounded-2xl p-4"><p class="text-xs">Received</p><p id="statReceived" class="text-2xl font-bold">0</p></div></div>
  <div class="bg-white rounded-[20px] p-4"><div class="flex flex-col lg:flex-row justify-between gap-3 mb-4"><div class="flex gap-2 flex-wrap"><input id="repSearch" oninput="filterRep()" placeholder="Search name, ID..." class="px-4 py-2 rounded-full border text-sm w-60"><select id="filterStatus" onchange="filterRep()" class="px-3 py-2 rounded-full border text-sm"><option value="">All</option><option value="Pending">Pending</option><option value="Approved">Approved</option></select><select id="filterReceived" onchange="filterRep()" class="px-3 py-2 rounded-full border text-sm"><option value="">All Received</option><option value="Yes">Yes</option><option value="No">No</option></select></div><div class="flex gap-2"><button onclick="openAddModal()" class="px-4 py-2 rounded-full bg-slate-900 text-white text-sm">Add Manual</button><button onclick="loadData()" class="px-4 py-2 rounded-full border text-sm">Refresh</button><button onclick="exportExcel()" class="px-5 py-2 rounded-full bg-green-600 text-white text-sm font-semibold">Export Excel</button></div></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b text-xs"><th class="py-3 px-2">Date</th><th>Name / ID</th><th>Handout</th><th>Amount / MoMo</th><th>Payment</th><th>Received</th><th>Actions</th></tr></thead><tbody id="repBody"><tr><td colspan="7" class="text-center py-12">Loading...</td></tr></tbody></table></div></div>
</div>

<div id="addModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-lg"><h3 class="font-bold">Add Manual Record</h3><div class="grid gap-3 mt-4"><input id="m_name" placeholder="Student Name *" class="px-4 py-3 rounded-xl border"><input id="m_sid" placeholder="Student ID (optional)" class="px-4 py-3 rounded-xl border"><div class="grid grid-cols-2 gap-3"><input id="m_phone" placeholder="Phone" class="px-4 py-3 rounded-xl border"><input id="m_amount" type="number" placeholder="Amount" class="px-4 py-3 rounded-xl border"></div><input id="m_momo" placeholder="MoMo Name" class="px-4 py-3 rounded-xl border"><input id="m_handout" placeholder="Handout" class="px-4 py-3 rounded-xl border"><div class="grid grid-cols-2 gap-3"><select id="m_status" class="px-4 py-3 rounded-xl border"><option>Pending</option><option>Approved</option></select><select id="m_received" class="px-4 py-3 rounded-xl border"><option value="No">Not Received</option><option value="Yes">Received</option></select></div></div><div class="flex gap-2 mt-5"><button onclick="closeAddModal()" class="flex-1 py-2.5 rounded-xl border">Cancel</button><button onclick="addManual()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white">Save</button></div></div></div>
</main>
<script>
let allData=[];let isRepLoggedIn=localStorage.getItem('dit_rep_login')==='true';
function switchTab(tab){if(tab==='rep'&&!isRepLoggedIn){document.getElementById('loginModal').classList.remove('hidden');return;}document.getElementById('portal-student').classList.toggle('hidden',tab!=='student');document.getElementById('portal-rep').classList.toggle('hidden',tab!=='rep');document.getElementById('tab-student').className=tab==='student'?'px-5 py-2 rounded-full bg-indigo-600 text-white text-sm':'px-5 py-2 rounded-full bg-white border text-sm';document.getElementById('tab-rep').className=tab==='rep'?'px-5 py-2 rounded-full bg-indigo-600 text-white text-sm':'px-5 py-2 rounded-full bg-white border text-sm';document.getElementById('logoutBtn').classList.toggle('hidden',!isRepLoggedIn);if(tab==='rep')loadData();}
function closeLogin(){document.getElementById('loginModal').classList.add('hidden');}
function repLogin(){if(document.getElementById('repPassInput').value===REP_PASSWORD){localStorage.setItem('dit_rep_login','true');isRepLoggedIn=true;closeLogin();switchTab('rep');}else document.getElementById('loginError').classList.remove('hidden');}
function repLogout(){localStorage.removeItem('dit_rep_login');isRepLoggedIn=false;switchTab('student');}
function openAddModal(){document.getElementById('addModal').classList.remove('hidden');}
function closeAddModal(){document.getElementById('addModal').classList.add('hidden');}
document.getElementById('studentForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('s_btn');const msg=document.getElementById('s_msg');const rec={id:Date.now().toString(),date:new Date().toLocaleString(),name:document.getElementById('s_name').value.trim(),studentId:document.getElementById('s_id').value.trim(),course:document.getElementById('s_course').value,phone:document.getElementById('s_phone').value.trim(),handout:document.getElementById('s_handout').value,qty:document.getElementById('s_qty').value,amountPaid:document.getElementById('s_amount').value,momoName:document.getElementById('s_momo').value.trim(),paymentStatus:'Pending',received:'No',action:'create'};btn.disabled=true;btn.innerHTML='Submitting...';try{await fetch(GOOGLE_SHEET_API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(rec)});await new Promise(r=>setTimeout(r,1200));msg.innerHTML="<span class='text-green-600 font-bold'>✅ Submitted! Rep will approve soon.</span>";const waText=`NEW DIT PAYMENT%0AName: ${rec.name}%0AID: ${rec.studentId||'Name only'}%0AHandout: ${rec.handout}%0AAmount: GHS ${rec.amountPaid}%0AMoMo: ${rec.momoName}%0APhone: ${rec.phone}`;window.open(`https://wa.me/${REP_WHATSAPP}?text=${waText}`,'_blank');e.target.reset();}catch(err){msg.innerHTML=`Error: ${err.message}`;}finally{btn.disabled=false;btn.innerHTML='Submit Payment Proof';}});
async function loadData(){const tbody=document.getElementById('repBody');try{tbody.innerHTML='<tr><td colspan="7" class="text-center py-8">Loading...</td></tr>';const res=await fetch(GOOGLE_SHEET_API_URL);const data=await res.json();allData=data;renderRep(data);}catch(err){tbody.innerHTML=`<tr><td colspan="7" class="text-center text-red-500">${err.message}</td></tr>`;}}
function renderRep(list){const tbody=document.getElementById('repBody');document.getElementById('statTotal').innerText=list.length;document.getElementById('statPending').innerText=list.filter(r=>r.paymentStatus==='Pending').length;document.getElementById('statApproved').innerText=list.filter(r=>r.paymentStatus==='Approved').length;document.getElementById('statReceived').innerText=list.filter(r=>r.received==='Yes').length;if(!list.length){tbody.innerHTML='<tr><td colspan="7" class="text-center py-12">No records</td></tr>';return;}tbody.innerHTML=list.slice().reverse().map(r=>{const id=r.id||'';const ps=r.paymentStatus||'Pending';const rc=r.received||'No';return `<tr class="border-b"><td class="py-3 px-2 text-xs">${r.date||''}</td><td class="px-2"><b>${r.name||''}</b><br><span class="text-xs">${r.studentId||'No ID'} • ${r.phone||''}</span></td><td class="px-2">${r.handout||''}</td><td class="px-2"><b>GHS ${r.amountPaid||''}</b><br><span class="text-xs">MoMo: ${r.momoName||''}</span></td><td class="px-2">${ps==='Approved'?'<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs">Approved</span>':'<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded-full text-xs">Pending</span>'}<br><button onclick="updateStatus('${id}','${ps==='Approved'?'Pending':'Approved'}')" class="mt-1 text-xs bg-slate-900 text-white px-2 py-1 rounded-full">${ps==='Pending'?'Approve':'Unapprove'}</button></td><td class="px-2">${rc==='Yes'?'<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-xs">Received</span>':'<span class="bg-slate-100 px-2 py-1 rounded-full text-xs">Not Received</span>'}<br><button onclick="toggleReceived('${id}','${rc}')" class="mt-1 text-xs border px-2 py-1 rounded-full">${rc==='Yes'?'Mark Not Received':'Mark Received'}</button></td><td class="px-2"><div class="flex gap-1"><a href="https://wa.me/${String(r.phone||'').replace(/[^0-9]/g,'')}" target="_blank" class="w-7 h-7 bg-green-50 text-green-600 flex items-center justify-center rounded-full"><i class="fab fa-whatsapp"></i></a><button onclick="deleteRecord('${id}')" class="w-7 h-7 bg-red-50 text-red-600 rounded-full"><i class="fas fa-trash text-xs"></i></button></div></td></tr>`;}).join('');}
function filterRep(){const q=document.getElementById('repSearch').value.toLowerCase();const s=document.getElementById('filterStatus').value;const r=document.getElementById('filterReceived').value;let f=allData.filter(x=>{const hay=`${x.name||''} ${x.studentId||''} ${x.handout||''}`.toLowerCase();return hay.includes(q)&&(!s||x.paymentStatus===s)&&(!r||x.received===r);});renderRep(f);}
async function updateStatus(id,st){await fetch(GOOGLE_SHEET_API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({id,paymentStatus:st,action:'update'})});setTimeout(loadData,1500);}
async function toggleReceived(id,cur){const nv=cur==='Yes'?'No':'Yes';await fetch(GOOGLE_SHEET_API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({id,received:nv,action:'update'})});setTimeout(loadData,1500);}
async function deleteRecord(id){if(!confirm('Delete?'))return;await fetch(GOOGLE_SHEET_API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({id,action:'delete'})});setTimeout(loadData,1500);}
async function addManual(){const rec={id:Date.now().toString(),date:new Date().toLocaleString(),name:document.getElementById('m_name').value.trim(),studentId:document.getElementById('m_sid').value.trim(),phone:document.getElementById('m_phone').value.trim(),amountPaid:document.getElementById('m_amount').value,momoName:document.getElementById('m_momo').value.trim(),handout:document.getElementById('m_handout').value.trim(),course:'Manual',qty:1,paymentStatus:document.getElementById('m_status').value,received:document.getElementById('m_received').value,action:'create'};if(!rec.name){alert('Name needed');return;}await fetch(GOOGLE_SHEET_API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(rec)});closeAddModal();setTimeout(loadData,1500);}
function exportExcel(){if(!allData.length){alert('No data');return;}const exp=allData.map(r=>({Date:r.date,Name:r.name,'Student ID':r.studentId,Course:r.course,Phone:r.phone,Handout:r.handout,Qty:r.qty,'Amount Paid':r.amountPaid,'MoMo Name':r.momoName,'Payment Status':r.paymentStatus,'Handout Received':r.received}));const ws=XLSX.utils.json_to_sheet(exp);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Records');XLSX.writeFile(wb,`DIT_Handouts_${new Date().toISOString().slice(0,10)}.xlsx`);}
function searchMyRecord(){const q=document.getElementById('studentSearch').value.toLowerCase().trim();const div=document.getElementById('myRecordResult');div.classList.remove('hidden');const found=allData.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.studentId||'').toLowerCase().includes(q));if(!found.length){div.innerHTML='No record for "'+q+'"';return;}div.innerHTML=found.map(r=>`<div class="mb-2"><b>${r.name}</b> (${r.studentId||'No ID'})<br>Handout: ${r.handout} - GHS ${r.amountPaid}<br>Status: <b>${r.paymentStatus}</b> | Received: <b>${r.received}</b></div>`).join('');}
if(isRepLoggedIn)switchTab('rep');else switchTab('student');
fetch(GOOGLE_SHEET_API_URL).then(r=>r.json()).then(d=>allData=d).catch(()=>{});
</script>
</body>
</html>
